version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: optimus_postgres
    environment:
      POSTGRES_USER: optimus
      POSTGRES_PASSWORD: optimus_password
      POSTGRES_DB: optimus_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - optimus_network

  redis:
    image: redis:7-alpine
    container_name: optimus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - optimus_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: optimus_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - optimus_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: optimus_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - optimus_network

  minio:
    image: minio/minio
    container_name: optimus_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: optimus_admin
      MINIO_ROOT_PASSWORD: optimus_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - optimus_network

  optimization-engine:
    build: 
      context: ./services/optimization-engine
    container_name: optimus_optimization_engine
    ports:
      - "8002:8000"
    environment:
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
    networks:
      - optimus_network

  optimization-worker:
    build: 
      context: ./services/optimization-engine
    container_name: optimus_optimization_worker
    command: celery -A app.worker:celery_app worker --loglevel=info
    environment:
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - redis
    networks:
      - optimus_network

  prediction-engine:
    build: 
      context: ./services/prediction-engine
    container_name: optimus_prediction_engine
    ports:
      - "8003:8000"
    environment:
      MINIO_URL: "minio:9000"
      MINIO_ACCESS_KEY: "optimus_admin"
      MINIO_SECRET_KEY: "optimus_password"
    depends_on:
      - minio
    networks:
      - optimus_network

  simulation-engine:
    build: 
      context: ./services/simulation-engine
    container_name: optimus_simulation_engine
    ports:
      - "8004:8000"
    networks:
      - optimus_network

  rules-engine:
    build: 
      context: ./services/rules-engine
    container_name: optimus_rules_engine
    ports:
      - "8005:8000"
    networks:
      - optimus_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: optimus_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - optimus_network

  knowledge-engine:
    build: 
      context: ./services/knowledge-engine
    container_name: optimus_knowledge_engine
    ports:
      - "8006:8000"
    depends_on:
      - qdrant
    networks:
      - optimus_network

  frontend:
    build:
      context: ./frontend
    container_name: optimus_frontend
    ports:
      - "5173:5173"
    networks:
      - optimus_network
    environment:
      - CHOKIDAR_USEPOLLING=true # To enable hot-reload inside Docker on Windows
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:

networks:
  optimus_network:
    driver: bridge
