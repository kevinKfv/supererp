version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: optimus_postgres
    environment:
      POSTGRES_USER: optimus
      POSTGRES_PASSWORD: optimus_password
      POSTGRES_DB: optimus_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - optimus_network

  redis:
    image: redis:7-alpine
    container_name: optimus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - optimus_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: optimus_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - optimus_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: optimus_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - optimus_network

  minio:
    image: minio/minio
    container_name: optimus_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: optimus_admin
      MINIO_ROOT_PASSWORD: optimus_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - optimus_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  optimus_network:
    driver: bridge
