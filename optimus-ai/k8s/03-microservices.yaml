# Gateway Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: optimus-ai
spec:
  replicas: 2 # Scale out gateway
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: optimus-gateway:latest
          imagePullPolicy: Never # Local image for PoC
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: optimus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: optimus-ai
spec:
  type: LoadBalancer # Expose to outside
  selector:
    app: gateway-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

