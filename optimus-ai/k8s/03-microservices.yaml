---
# Optimization Worker (Celery Background Solver)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimization-worker
  namespace: optimus-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: optimization-worker
  template:
    metadata:
      labels:
        app: optimization-worker
    spec:
      containers:
        - name: optimization-worker
          image: optimus-optimization:latest
          imagePullPolicy: Never
          command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: optimus-config

