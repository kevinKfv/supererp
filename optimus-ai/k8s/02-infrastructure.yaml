# Postgres Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: optimus-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: optimus-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              value: "changeme" # In production, use k8s Secret
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: optimus-config
                  key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: optimus-ai
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

