---
# MinIO Deployment & Service (Object Storage for ML Models)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: optimus-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: "optimus_admin"
            - name: MINIO_ROOT_PASSWORD
              value: "optimus_password"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: optimus-ai
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: console
      protocol: TCP
      port: 9001
      targetPort: 9001
